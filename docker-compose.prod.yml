# docker-compose.prod.yml (hardened)
#
# Key changes vs the original:
#  * Flower was published on 0.0.0.0:5555 with NO login ("block at firewall")
#    - it shows task arguments, i.e. resume contents. Now bound to localhost
#    and password-protected (reach it via SSH tunnel).
#  * Redis was `allkeys-lru`: under memory pressure Redis would EVICT queued
#    Celery tasks, silently losing jobs (analyses stuck on "pending").
#    Now `volatile-lru` (queue keys have no TTL so they are never evicted),
#    AOF persistence on, and a password required.
#  * NEXT_PUBLIC_* variables are inlined at `next build`; setting them at
#    runtime on the frontend container has no effect. If you deploy the
#    frontend on Vercel (as the README says) delete the `frontend` service.
#  * Healthcheck used `curl`, which python:slim images don't ship -> always
#    unhealthy. Uses python instead.
#  * Memory/CPU limits, log rotation, no-new-privileges, worker task limits.
#  * Pin image tags (use a registry + version tags instead of :latest).
#
# REDIS_URL must now include the password:  redis://:${REDIS_PASSWORD}@redis:6379/0

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  ENVIRONMENT: production
  ALLOW_DEV_AUTH: "false"
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
  CLERK_ISSUER: ${CLERK_ISSUER}
  CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES}
  CORS_ORIGINS: ${CORS_ORIGINS}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  TRUST_PROXY_HEADERS: "true"
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
  AWS_REGION: ${AWS_REGION}
  # Prefer an IAM instance role. Only set these two if you cannot:
  # AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  # AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  SENTRY_DSN: ${SENTRY_DSN}

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/ssl:/etc/ssl:ro
    depends_on:
      - backend
    restart: always
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]

  # Delete this service if the frontend is hosted on Vercel.
  frontend:
    image: resumeai-frontend:latest   # build with --build-arg NEXT_PUBLIC_... ; runtime env does not affect them
    environment:
      BACKEND_URL: http://backend:8000
    restart: always
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 768M }

  backend:
    image: resumeai-backend:latest
    environment:
      <<: *backend-env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    restart: always
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 1G }
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: resumeai-backend:latest
    command: >
      celery -A workers.celery_app worker --loglevel=warning --concurrency=2
      -Q celery --max-tasks-per-child=50 --soft-time-limit=240 --time-limit=300
    environment:
      <<: *backend-env
    restart: always
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "1.5", memory: 2G }   # OCR + parsing are memory hungry
    depends_on:
      redis:
        condition: service_healthy

  # Exactly ONE beat instance, otherwise periodic tasks (monthly quota reset) run multiple times.
  beat:
    image: resumeai-backend:latest
    command: celery -A workers.celery_app beat --loglevel=warning -s /tmp/celerybeat-schedule
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENVIRONMENT: production
    restart: always
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "0.25", memory: 256M }
    depends_on:
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    command: celery flower --port=5555
    environment:
      CELERY_BROKER_URL: ${REDIS_URL}
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH}     # format  user:strong-password
    ports:
      - "127.0.0.1:5555:5555"                     # localhost only; use an SSH tunnel
    restart: always
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    restart: always
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # no `ports:` on purpose - Redis is only reachable inside the compose network

volumes:
  redis_data: