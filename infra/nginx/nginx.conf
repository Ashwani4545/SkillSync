# nginx.conf (hardened). Mounted as /etc/nginx/conf.d/default.conf, so it is
# included inside the http{} block.
#
# Problems in the original, all fixed below:
#  * `add_header` inside a location REPLACES every add_header from the server
#    block. The /share/ location added Cache-Control and so lost HSTS, nosniff
#    and X-Frame-Options. Security headers are now only set at server level and
#    no location adds headers.
#  * /share/ and /health set no proxy_set_header, so nginx sent `Host: backend`
#    and no X-Real-IP. The app rate limiter then saw ONE client (the proxy) for
#    every public share visitor, and TrustedHost would reject the Host. Every
#    proxied location now sends the full set.
#  * 30 req/min per IP on all of /api/ is below what a single user's status
#    polling uses, and Indian campus / mobile-carrier NAT puts thousands of
#    users behind one IP. Raised; the per-user limits live in the app.
#  * `proxy_cache_valid` without `proxy_cache` did nothing, while
#    `Cache-Control: public, max-age=300` told browsers/CDNs to cache shared
#    personal reports for 5 minutes (even after revocation). Removed.
#  * Redirect used $host from the request (host-header redirect abuse) and
#    `server_name _`. Now redirects to the canonical host.
#  * Webhook traffic from Stripe was subject to the generic IP limit.
#  * /api/v1/admin is not reachable from the internet unless you allow your IP.
#  * Obsolete X-XSS-Protection removed; weak cipher string replaced; server
#    tokens hidden; dotfiles denied; unknown SNI rejected.
#
# BEFORE USE: replace resumeai.app with your real domain, and the admin IP below.
# If the frontend lives on Vercel, delete the `frontend` upstream and `location /`.

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 16;
}

# ── Rate limiting (per client IP; per-user limits are enforced in the app) ──
limit_req_zone  $binary_remote_addr zone=api_limit:10m    rate=120r/m;
limit_req_zone  $binary_remote_addr zone=upload_limit:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=share_limit:10m  rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server_tokens off;
limit_req_status  429;
limit_conn_status 429;

# ── HTTP -> HTTPS (canonical host, never echo the request Host) ──
server {
    listen 80 default_server;
    server_name _;
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }   # if you use certbot webroot
    location / { return 301 https://resumeai.app$request_uri; }
}

# ── Reject TLS handshakes for unknown hostnames ──
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;                               # nginx >= 1.25.1
    server_name resumeai.app www.resumeai.app;

    ssl_certificate     /etc/ssl/certs/resumeai.crt;
    ssl_certificate_key /etc/ssl/private/resumeai.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers: SERVER LEVEL ONLY. Do not add add_header inside locations
    # (it would drop all of these for that location). `always` covers error pages.
    add_header X-Frame-Options           "DENY"                                  always;
    add_header X-Content-Type-Options    "nosniff"                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"   always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # A Content-Security-Policy belongs in next.config.js (Next needs per-request nonces).

    client_max_body_size 1m;                # JSON bodies only; uploads override below
    limit_conn conn_limit 200;   # high on purpose: campus/mobile NAT shares one IP

    # Never serve dotfiles
    location ~ /\.(?!well-known) { deny all; }

    # ── Stripe webhook: signature-verified in the app, exempt from IP limiting ──
    location = /api/v1/billing/webhook {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Admin API: closed to the internet. Put YOUR office/VPN IP here. ──
    location /api/v1/admin/ {
        allow 203.0.113.10;                 # <-- CHANGE ME (documentation address; blocks everyone until replaced)
        deny  all;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Resume upload: the only place bigger bodies are allowed ──
    location = /api/v1/resume/upload {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 11m;           # app enforces 10 MB
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  90s;            # parsing/OCR happens inline
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ── Public share pages: own limit, NOT cached (links can be revoked) ──
    location /api/v1/share/ {
        limit_req zone=share_limit burst=30 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check (no access log noise) ──
    location = /api/v1/health {
        access_log off;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else under /api/ ──
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # ── Frontend (Next.js) ──
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}